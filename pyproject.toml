[build-system]
requires = []
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-lifespan-testclient-debug-lab"
version = "0.1.0"
description = "FastAPI TestClientとlifespan境界を再現するデバッグ教材"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
